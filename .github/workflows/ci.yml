name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r apps/platform-backend/requirements.txt
          pip install ruff pytest pytest-asyncio pyyaml
      - name: Lint (advisory, whole tree)
        run: ruff check apps/platform-backend apps/sample-ai-service || true
      - name: Lint gate (new chat + store + llm modules)
        working-directory: apps/platform-backend
        run: ruff check app/chat app/llm app/store app/redact.py app/observability.py app/schemas.py
      - name: Test core GitOps loop + chat subsystem
        run: pytest tests/ -q
      - name: RAG retrieval eval (advisory)
        run: python tests/eval/rag_eval.py || echo "recall below threshold — consider a hybrid retriever"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: apps/platform-frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint + template
        run: |
          helm lint charts/ai-service
          helm template charts/ai-service -f gitops/environments/dev/sample-ai-service.yaml >/dev/null

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images (validate Dockerfiles)
        run: |
          docker build -t sample-ai-service apps/sample-ai-service
          docker build -t platform-backend apps/platform-backend
          docker build -t platform-frontend apps/platform-frontend
      # On AWS: configure-aws-credentials + amazon-ecr-login, then push to ECR and
      # bump gitops/environments/dev/<svc>.yaml image.tag. Enable when EKS is live.
