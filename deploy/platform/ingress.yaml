# Single dashboard host. /api/* -> backend, everything else -> frontend.
# Same-origin means the browser needs no CORS and no API URL config.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  namespace: platform
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # SSE for the chat stream: without buffering off, nginx holds the whole
    # response and the "streaming" turn arrives in one lump. The long read
    # timeout keeps a slow multi-tool turn from being cut mid-stream.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: dashboard.127.0.0.1.nip.io
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: platform-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: platform-frontend
                port:
                  number: 80
