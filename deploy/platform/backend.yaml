apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-backend
  namespace: platform
---
# Read-only across the cluster: pods + logs for the status/logs APIs.
# The backend has NO write access to the API server — deploys go through git.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-backend-read
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Read-only view of ArgoCD sync/health so the assistant can answer
  # "has my deploy landed yet?". Still no write verbs anywhere — the invariant holds.
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-backend-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-backend-read
subjects:
  - kind: ServiceAccount
    name: platform-backend
    namespace: platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-backend-config
  namespace: platform
data:
  AI_NAMESPACE: ai-services
  GITOPS_BRANCH: main
  GITOPS_VALUES_TEMPLATE: gitops/environments/dev/{service}.yaml
  PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
  GIT_AUTHOR_NAME: platform-bot
  GIT_AUTHOR_EMAIL: platform-bot@local
  # Chat assistant (non-secret). LLM_PROVIDER is set imperatively by bootstrap.sh
  # from the caller's environment, alongside the API key in the secret — an
  # unset provider is a valid state (chat 503s with setup instructions).
  KNOWLEDGE_DB_PATH: /data/knowledge.db
  CLAUDE_MODEL: claude-opus-5
  GEMINI_MODEL: gemini-flash-latest
  OPENAI_MODEL: gpt-4o-mini
  LLM_EFFORT: high
  OLLAMA_URL: http://ollama.platform.svc.cluster.local:11434
  OLLAMA_MODEL: llama3.1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-backend
  namespace: platform
  labels:
    app: platform-backend
spec:
  replicas: 1
  # RWO knowledge volume: the default RollingUpdate would try to schedule a
  # second pod that can't mount the same volume. Recreate avoids the deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: platform-backend
  template:
    metadata:
      labels:
        app: platform-backend
    spec:
      serviceAccountName: platform-backend
      containers:
        - name: backend
          image: localhost:5001/platform-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-backend-config
            - secretRef:
                name: platform-backend-secrets
          volumeMounts:
            - name: knowledge
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: knowledge
          persistentVolumeClaim:
            claimName: platform-knowledge
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-knowledge
  namespace: platform
spec:
  # kind's default local-path StorageClass provisions this. Not emptyDir:
  # learned issues surviving a pod restart is the whole point of the store.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-backend
  namespace: platform
  labels:
    app: platform-backend
spec:
  selector:
    app: platform-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# Prometheus scrapes the backend's /metrics so the chat subsystem reports into
# the same monitoring stack as everything else. serviceMonitorSelectorNilUsesHelmValues
# is false in the stack values, so this is picked up from any namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: platform-backend
  namespace: platform
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: platform-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
