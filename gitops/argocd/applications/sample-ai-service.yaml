apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-ai-service
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/platform/gitops.git
    targetRevision: HEAD
    path: charts/ai-service
    helm:
      # Path resolves within the repo root (allowed by ArgoCD's traversal guard).
      valueFiles:
        - ../../gitops/environments/dev/sample-ai-service.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-services
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
