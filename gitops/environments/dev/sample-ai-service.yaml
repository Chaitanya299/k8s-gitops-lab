# MANAGED BY THE PLATFORM BACKEND.
# Rewritten on every Deploy, committed to git, and synced by ArgoCD.
# Hand edits will be overwritten on the next deploy.
replicaCount: 1

image:
  repository: localhost:5001/sample-ai-service
  tag: "0.1.0"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  SERVICE_NAME: sample-ai-service
  MODEL: echo

ingress:
  enabled: true
  host: sample-ai-service.127.0.0.1.nip.io
