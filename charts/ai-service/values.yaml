# Default values. The platform backend writes per-service overrides into
# gitops/environments/dev/<service>.yaml; ArgoCD renders this chart with them.

# Image — points at the in-cluster kind registry by default.
image:
  repository: localhost:5001/sample-ai-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Replicas (used only when autoscaling.enabled=false; otherwise HPA owns it).
replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: sample-ai-service.127.0.0.1.nip.io

# Resource requests/limits — set from the dashboard CPU/Memory fields.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Horizontal Pod Autoscaler. The dashboard's "replicas" maps to minReplicas so
# the requested count is always running.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# Non-sensitive env -> ConfigMap (e.g. MODEL, SERVICE_NAME).
env:
  SERVICE_NAME: sample-ai-service
  MODEL: echo

# Sensitive env -> Secret (e.g. API keys). Empty by default.
secretEnv: {}

probes:
  livenessPath: /health
  readinessPath: /ready

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 15s
  path: /metrics

serviceAccount:
  create: true
  name: ""
